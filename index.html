<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontrol Dokumen Keluar-Masuk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Load Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f4f6f9; }
        .main-container { max-width: 900px; margin: 40px auto; }
        #docNumber { text-align: center; letter-spacing: 2px; font-weight: bold; }
        .chart-container { position: relative; height: 250px; width: 100%; display: flex; justify-content: center; }
        .stats-text { font-size: 1.1rem; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container main-container">
        <div class="card shadow-lg border-0 rounded-3">
            <div class="card-header bg-dark text-white text-center py-3">
                <h4 class="mb-0">Scanner Dokumen Out / In</h4>
            </div>
            <div class="card-body p-4">
                <div class="row">
                    
                    <!-- Kolom Kiri: Form Scanner -->
                    <div class="col-md-7 border-end pe-md-4">
                        <div id="alertArea"></div>
                        <form id="scanForm">
                            <div class="mb-4">
                                <label for="docNumber" class="form-label text-muted">Arahkan Scanner & Scan Barcode</label>
                                <input type="text" class="form-control form-control-lg border-primary" id="docNumber" autocomplete="off" required autofocus>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2" id="submitBtn">Proses Dokumen</button>
                        </form>
                        <div class="mt-3 text-center text-muted small">
                            <i>Data otomatis tersimpan ke Google Spreadsheet</i>
                        </div>
                    </div>

                    <!-- Kolom Kanan: Statistik & Pie Chart -->
                    <div class="col-md-5 ps-md-4 text-center mt-4 mt-md-0">
                        <h5 class="text-secondary mb-3">Statistik Dokumen</h5>
                        <div class="chart-container">
                            <canvas id="statsChart"></canvas>
                        </div>
                        <div id="textStats" class="stats-text text-secondary">
                            Memuat data...
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        // GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT YANG BARU
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxpTbn2Ixx6jmp2uIaRWatyWwutoBHie4b4jCDGJDefnvsn10Aef0m3MeCqVJy5wAG2nw/exec'; 

        const form = document.getElementById('scanForm');
        const docInput = document.getElementById('docNumber');
        const alertArea = document.getElementById('alertArea');
        const submitBtn = document.getElementById('submitBtn');
        const textStats = document.getElementById('textStats');
        
        let pieChart;

        // Inisialisasi Chart.js
        function initChart() {
            const ctx = document.getElementById('statsChart').getContext('2d');
            pieChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['Selesai (IN)', 'Belum Kembali (OUT)'],
                    datasets: [{
                        data: [0, 0],
                        backgroundColor: ['#198754', '#ffc107'], // Hijau (IN), Kuning (OUT)
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });
        }

        // Update data Chart & Teks Persentase
        function updateStats(inCount, outCount) {
            pieChart.data.datasets[0].data = [inCount, outCount];
            pieChart.update();

            let total = inCount + outCount;
            if (total === 0) {
                textStats.innerHTML = "Belum ada data dokumen.";
                return;
            }

            let inPercent = Math.round((inCount / total) * 100);
            let outPercent = Math.round((outCount / total) * 100);
            
            textStats.innerHTML = `
                <span class="text-success">IN: ${inCount} (${inPercent}%)</span> | 
                <span class="text-warning">OUT: ${outCount} (${outPercent}%)</span><br>
                <small class="text-muted">Total Dokumen: ${total}</small>
            `;
        }

        // Jalankan saat web pertama kali dibuka
        initChart();
        fetch(`${SCRIPT_URL}?action=getStats`)
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    updateStats(data.stats.in, data.stats.out);
                }
            }).catch(err => { textStats.innerHTML = "Gagal memuat statistik."; });

        // Paksa input tetap fokus
        document.addEventListener('click', () => {
            if(document.activeElement !== docInput) docInput.focus();
        });

        // Proses submit form
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const docNumber = docInput.value.trim();
            if (!docNumber) return;

            submitBtn.disabled = true;
            submitBtn.innerText = "Memproses...";
            docInput.disabled = true;
            alertArea.innerHTML = "";

            // Gunakan metode GET untuk menghindari error CORS
            fetch(`${SCRIPT_URL}?docNumber=${encodeURIComponent(docNumber)}`)
            .then(response => response.json())
            .then(data => {
                let alertHTML = '';
                if (data.status === 'success') {
                    let bgColor = data.type === 'OUT' ? 'alert-info' : 'alert-success';
                    alertHTML = `<div class="alert ${bgColor} fw-bold text-center">${data.message}</div>`;
                } else {
                    alertHTML = `<div class="alert alert-danger fw-bold text-center">❌ ${data.message}</div>`;
                }
                alertArea.innerHTML = alertHTML;
                
                // Update chart berdasarkan balasan dari server
                if (data.stats) {
                    updateStats(data.stats.in, data.stats.out);
                }
            })
            .catch(error => {
                alertArea.innerHTML = `<div class="alert alert-danger text-center">Gagal terhubung ke database.</div>`;
            })
            .finally(() => {
                docInput.value = '';
                docInput.disabled = false;
                submitBtn.disabled = false;
                submitBtn.innerText = "Proses Dokumen";
                docInput.focus();
            });
        });
    </script>
</body>
</html>
